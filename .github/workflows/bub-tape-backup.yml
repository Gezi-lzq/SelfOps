name: Bub Tape Backup

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      profile:
        description: 'Profile to backup'
        required: true
        default: 'yuna'
        type: choice
        options:
          - yuna

jobs:
  backup:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Backup tape
        run: mise -C agents/bub run bub:backup ${{ inputs.profile }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
