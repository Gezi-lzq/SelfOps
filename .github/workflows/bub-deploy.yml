name: Bub Deploy

on:
  push:
    branches: [main]
    paths:
      - 'agents/bub/**'
  workflow_dispatch:
    inputs:
      profile:
        description: 'Profile to deploy'
        required: true
        default: 'yuna'
        type: choice
        options:
          - yuna
          - all

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Write env file
        run: |
          PROFILE="${{ inputs.profile || 'yuna' }}"
          if [ "$PROFILE" = "all" ]; then
            PROFILES=(yuna)
          else
            PROFILES=("$PROFILE")
          fi
          for p in "${PROFILES[@]}"; do
            TEMPLATE="agents/bub/profiles/${p}/env.template"
            if [ ! -f "$TEMPLATE" ]; then
              echo "No env.template found for profile ${p}" >&2
              exit 1
            fi
            mkdir -p "/opt/bub/profiles/${p}"
            envsubst < "$TEMPLATE" > "/opt/bub/profiles/${p}/env"
          done
        env:
          BUB_MODEL: ${{ secrets.BUB_MODEL }}
          BUB_API_KEY: ${{ secrets.BUB_API_KEY }}
          BUB_API_BASE: ${{ secrets.BUB_API_BASE }}
          BUB_API_FORMAT: ${{ secrets.BUB_API_FORMAT }}
          BUB_ENABLED_CHANNELS: ${{ secrets.BUB_ENABLED_CHANNELS }}
          BUB_QQ_APPID: ${{ secrets.BUB_QQ_APPID }}
          BUB_QQ_SECRET: ${{ secrets.BUB_QQ_SECRET }}
          BUB_QQ_RECEIVE_MODE: ${{ secrets.BUB_QQ_RECEIVE_MODE }}
          BUB_TELEGRAM_TOKEN: ${{ secrets.BUB_TELEGRAM_TOKEN }}
          BUB_FEISHU_APP_ID: ${{ secrets.BUB_FEISHU_APP_ID }}
          BUB_FEISHU_APP_SECRET: ${{ secrets.BUB_FEISHU_APP_SECRET }}

      - name: Deploy
        run: |
          chmod +x agents/bub/deploy.sh
          bash agents/bub/deploy.sh ${{ inputs.profile || 'yuna' }}
