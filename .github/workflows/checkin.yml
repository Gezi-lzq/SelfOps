name: NewAPI Checkin

on:
  schedule:
    - cron: '10 0 * * *'  # 8:10 AM Beijing Time
  workflow_dispatch:

jobs:
  checkin:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        account: ${{ fromJson(vars.NEWAPI_ACCOUNTS) }}
      fail-fast: false
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - run: pip install requests
      
      - name: Checkin
        id: checkin
        run: |
          python newapi-checkin/checkin.py --url "${{ matrix.account.url }}" --auth "${{ secrets[matrix.account.auth] }}" | tee result.json
          echo "result=$(cat result.json)" >> $GITHUB_OUTPUT
      
      - name: Summary
        run: |
          echo "### ${{ matrix.account.name }}" >> $GITHUB_STEP_SUMMARY
          result='${{ steps.checkin.outputs.result }}'
          success=$(echo "$result" | jq -r '.success')
          if [ "$success" = "true" ]; then
            quota=$(echo "$result" | jq -r '.quota // .message // "done"')
            echo "✅ Success | Quota: $quota" >> $GITHUB_STEP_SUMMARY
          else
            error=$(echo "$result" | jq -r '.error // "unknown error"')
            echo "❌ Failed: $error" >> $GITHUB_STEP_SUMMARY
          fi
