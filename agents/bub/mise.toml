[env]
BUB_ROOT = "{{ config_root }}"

[tasks."bub:deploy"]
description = "Deploy a bub profile (e.g. mise run bub:deploy yuna)"
run = """
#!/usr/bin/env bash
set -euo pipefail
PROFILE="${1:-yuna}"
bash "${BUB_ROOT}/deploy.sh" "$PROFILE"
"""

[tasks."bub:write-env"]
description = "Render env.template for a profile (e.g. mise run bub:write-env yuna)"
run = """
#!/usr/bin/env bash
set -euo pipefail
PROFILE="${1:-yuna}"
TEMPLATE="${BUB_ROOT}/profiles/${PROFILE}/env.template"
TARGET="/opt/bub/profiles/${PROFILE}/env"
if [ ! -f "$TEMPLATE" ]; then
  echo "No env.template found for profile ${PROFILE}" >&2
  exit 1
fi
mkdir -p "$(dirname "$TARGET")"
envsubst < "$TEMPLATE" > "$TARGET"
echo "Wrote ${TARGET}"
"""

[tasks."bub:backup"]
description = "Backup tape for a profile to GitHub Releases (e.g. mise run bub:backup yuna)"
run = """
#!/usr/bin/env bash
set -euo pipefail
PROFILE="${1:-yuna}"
bash "${BUB_ROOT}/backup.sh" "$PROFILE"
"""
