[tools]
python = "3.12"
node = "latest"
"npm:@openai/codex" = "latest"
"npm:@anthropic-ai/claude-code" = "latest"

[env]
SELFOPS_ROOT = "{{ config_root }}"

[tasks.doctor]
description = "Check SelfOps local toolchain and registry files"
run = "python --version && mise --version"

[tasks."nmem:install"]
description = "Install nmem CLI (Nowledge Mem) via APT on Linux or guide on macOS"
run = """
#!/usr/bin/env bash
set -euo pipefail
if command -v nmem >/dev/null 2>&1; then
  echo "nmem already installed: $(nmem --version 2>&1 | head -1)"
  exit 0
fi
case "$(uname -s)" in
  Linux)
    echo "Installing nmem via APT..."
    curl -fsSL https://nowledge-co.github.io/community/apt/install.sh | sudo bash
    sudo apt-get install -y nowledge-mem
    echo "nmem installed: $(nmem --version 2>&1 | head -1)"
    ;;
  Darwin)
    echo "On macOS, install Nowledge Mem desktop app, then:"
    echo "  Settings → Preferences → Developer Tools → Install CLI"
    exit 1
    ;;
  *)
    echo "Unsupported platform: $(uname -s)" >&2
    exit 1
    ;;
esac
"""

[tasks."nmem:configure"]
description = "Configure nmem remote connection (set NMEM_API_URL and NMEM_API_KEY first)"
run = """
#!/usr/bin/env bash
set -euo pipefail
if ! command -v nmem >/dev/null 2>&1; then
  echo "nmem not found. Run: mise run nmem:install" >&2
  exit 1
fi
if [[ -z "${NMEM_API_URL:-}" || -z "${NMEM_API_KEY:-}" ]]; then
  echo "Set NMEM_API_URL and NMEM_API_KEY first." >&2
  echo '  export NMEM_API_URL="http://<server>:14242"'
  echo '  export NMEM_API_KEY="nmem_..."'
  exit 1
fi
nmem config client set --url "$NMEM_API_URL" --api-key "$NMEM_API_KEY"
nmem status
"""

[tasks."obs:up"]
description = "Start observability stack"
dir = "{{config_root}}/infra/observability"
run = "docker-compose up -d"

[tasks."obs:down"]
description = "Stop observability stack"
dir = "{{config_root}}/infra/observability"
run = "docker-compose down"

[tasks."obs:logs"]
description = "Tail observability stack logs"
dir = "{{config_root}}/infra/observability"
run = "docker-compose logs -f"

[tasks."obs:status"]
description = "Show observability stack container status"
dir = "{{config_root}}/infra/observability"
run = "docker-compose ps"

[tasks."obs:expose"]
description = "Expose Grafana via Cloudflare quick tunnel"
run = "cloudflared tunnel --url http://localhost:3000"

[tasks."herdr-web:install"]
description = "Install Herdr browser-access systemd user units"
run = "bash dev/dev-machine/herdr-web/install.sh"

[tasks."herdr-web:install-ngrok"]
description = "Install ngrok v3 into ~/.local/bin without sudo"
run = "bash dev/dev-machine/herdr-web/install-ngrok-user.sh"

[tasks."herdr-web:start"]
description = "Start Herdr browser access through ttyd and ngrok"
run = "systemctl --user start herdr-web-ttyd.service herdr-status.service herdr-web-proxy.service herdr-web-ngrok.service"

[tasks."herdr-web:stop"]
description = "Stop Herdr browser access"
run = "systemctl --user stop herdr-web-ngrok.service herdr-web-proxy.service herdr-status.service herdr-web-ttyd.service"

[tasks."herdr-web:status"]
description = "Show Herdr browser-access service status"
run = "systemctl --user status herdr-web-ttyd.service herdr-status.service herdr-web-proxy.service herdr-web-ngrok.service --no-pager"

[tasks."herdr-web:logs"]
description = "Follow Herdr browser-access service logs"
run = "journalctl --user -fu herdr-web-ttyd.service -fu herdr-status.service -fu herdr-web-proxy.service -fu herdr-web-ngrok.service"

[tasks."herdr-web:url"]
description = "Print the current ngrok HTTPS URL for Herdr browser access"
run = "bash dev/dev-machine/herdr-web/bin/herdr-web-url"

[tasks."herdr-web:enable"]
description = "Enable Herdr browser-access services on user login"
run = "systemctl --user enable herdr-web-ttyd.service herdr-status.service herdr-web-proxy.service herdr-web-ngrok.service"

[tasks."herdr-web:disable"]
description = "Disable Herdr browser-access services on user login"
run = "systemctl --user disable herdr-web-ngrok.service herdr-web-proxy.service herdr-status.service herdr-web-ttyd.service"

[tasks."herdr-status:serve"]
description = "Serve a read-only mobile dashboard for Herdr agent status"
run = "python dev/dev-machine/herdr-status/server.py"

[tasks."herdr-status:install"]
description = "Install Herdr status dashboard systemd user unit"
run = "bash dev/dev-machine/herdr-status/install.sh"

[tasks."herdr-status:start"]
description = "Start Herdr status dashboard"
run = "systemctl --user start herdr-status.service"

[tasks."herdr-status:stop"]
description = "Stop Herdr status dashboard"
run = "systemctl --user stop herdr-status.service"

[tasks."herdr-status:status"]
description = "Show Herdr status dashboard service status"
run = "systemctl --user status herdr-status.service --no-pager"

[tasks."herdr-status:logs"]
description = "Follow Herdr status dashboard logs"
run = "journalctl --user -fu herdr-status.service"

[tasks."herdr-status:enable"]
description = "Enable Herdr status dashboard on user login"
run = "systemctl --user enable herdr-status.service"

[tasks."herdr-status:disable"]
description = "Disable Herdr status dashboard on user login"
run = "systemctl --user disable herdr-status.service"

[tasks."agent:scan"]
description = "Scan configured roots for existing agent skills"
run = "mise -C dev/agent-runtime run agent:scan"

[tasks."agent:plan"]
description = "Compare declared desired state with scanned actual state"
run = "mise -C dev/agent-runtime run agent:plan"

[tasks."agent:apply"]
description = "Apply skill source sync and runtime directory changes"
run = "mise -C dev/agent-runtime run agent:apply"
