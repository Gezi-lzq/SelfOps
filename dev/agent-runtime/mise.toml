[tools]
python = "3.12"
node = "latest"
"npm:@openai/codex" = "latest"
"npm:@anthropic-ai/claude-code" = "latest"

[env]
SELFOPS_AGENT_RUNTIME_ROOT = "{{ config_root }}"
SELFOPS_AGENT_RUNTIME_REGISTRY = "{{ config_root }}/registry"
SELFOPS_AGENT_RUNTIME_STATE = "{{ config_root }}/.state"

[tasks."agent:scan"]
description = "Scan actual agent skill directories"
run = "python scripts/agent_runtime.py scan"

[tasks."agent:plan"]
description = "Plan skill source sync and runtime directory changes"
run = "python scripts/agent_runtime.py plan"

[tasks."agent:apply"]
description = "Apply skill source sync and runtime directory changes"
run = "python scripts/agent_runtime.py apply"

[tasks."agent:update"]
description = "Update public skills to latest versions via npx"
run = "npx skills update -p -y"
