# Project desired state.
#
# Per-agent overrides: if [projects.<path>.agent_overrides.<agent>] exists,
# its bundles/include/exclude REPLACE the project-level defaults for that agent.

scan_dirs = ["~/Dev"]

# ─────────────────────────────────────────────
# Global — only tools + memory
# ─────────────────────────────────────────────

[projects."@global"]
agents = ["kiro", "claude", "codex", "agents"]
bundles = ["core", "tools", "memory", "lark-core", "ponytail", "mattpocock"]
include = [
  "obelisk",
  "skill-management",
]
exclude = []

[projects."@global".agent_overrides.agents]
bundles = ["core", "tools", "memory", "lark-core", "ponytail", "mattpocock"]
include = [
  "obelisk",
  "assess-cluster-watermark-and-health",
  "skill-management",
]
exclude = []

