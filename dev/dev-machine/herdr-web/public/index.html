<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>gezi-dev</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #101214;
      --panel: #181b1f;
      --panel-2: #20242a;
      --text: #eef2f4;
      --muted: #9aa4ad;
      --line: #313841;
      --accent: #58c4a3;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.35;
    }
    header {
      border-bottom: 1px solid var(--line);
      padding: 18px 16px 14px;
      background: rgba(16, 18, 20, 0.96);
    }
    .wrap {
      width: min(900px, 100%);
      margin: 0 auto;
    }
    h1 {
      margin: 0 0 6px;
      font-size: 22px;
      letter-spacing: 0;
    }
    .meta {
      color: var(--muted);
      font-size: 13px;
    }
    main {
      padding: 14px 16px 24px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 12px;
    }
    .card {
      display: flex;
      flex-direction: column;
      gap: 10px;
      min-height: 136px;
      padding: 14px;
      color: var(--text);
      text-decoration: none;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
    }
    .card:focus-visible,
    .card:hover {
      border-color: rgba(88, 196, 163, 0.7);
      outline: none;
    }
    .card h2 {
      margin: 0;
      font-size: 16px;
      letter-spacing: 0;
    }
    .card p {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
    }
    .path {
      margin-top: auto;
      color: var(--accent);
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 12px;
      overflow-wrap: anywhere;
    }
    .section-title {
      margin: 0 0 10px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <header>
    <div class="wrap">
      <h1>gezi-dev</h1>
      <div class="meta">Public router for local dev-machine tools</div>
    </div>
  </header>
  <main>
    <div class="wrap">
      <div class="section-title">Services</div>
      <div class="grid">
        <a class="card" href="/herdr">
          <h2>Herdr Status</h2>
          <p>Session, pane, agent status, history, and browser terminal links.</p>
          <div class="path">/herdr</div>
        </a>
        <a class="card" href="/kiro-gateway">
          <h2>Kiro Gateway</h2>
          <p>Local Kiro Gateway health and API entrypoint.</p>
          <div class="path">/kiro-gateway</div>
        </a>
      </div>
    </div>
  </main>
</body>
</html>
